; MixR variant only (removed at build time when CLAMAV != 1)
[program:clamd]
command=/usr/sbin/clamd -c /etc/clamav/clamd.conf --pid=/run/clamav/clamd.pid
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:freshclam]
command=/usr/bin/freshclam -d --quiet --config-file=/etc/clamav/freshclam.conf
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
